<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You</title>

<style>
:root{
  --bg1:#fff8f0;
  --bg2:#ffe7d1;
  --card:#ffffffcc;
  --text:#3b2f2f;
  --accent:#c56b4f;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Georgia", serif;
  color:var(--text);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow:hidden;
}

.card{
  width:min(760px,100%);
  background:var(--card);
  backdrop-filter:blur(8px);
  border-radius:20px;
  padding:40px 28px;
  text-align:center;
  box-shadow:0 15px 35px rgba(0,0,0,.12);
  animation:fadeIn .9s ease;
  position:relative;
}

h1{
  margin:0 0 12px;
  font-size:2.2rem;
  color:var(--accent);
}

p{
  font-size:1.1rem;
  line-height:1.6;
}

a{
  display:inline-block;
  margin-top:20px;
  padding:10px 18px;
  background:var(--accent);
  color:white;
  text-decoration:none;
  border-radius:999px;
  font-size:.95rem;
}

a:hover{
  opacity:.9;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}

/* floating hearts */
.heart{
  position:absolute;
  font-size:18px;
  animation:float 5s linear infinite;
  opacity:.7;
}

@keyframes float{
  0%{transform:translateY(100%) scale(.7);opacity:0}
  20%{opacity:.8}
  100%{transform:translateY(-120%) scale(1.2);opacity:0}
}
</style>
</head>

<body>

<div class="card">
  <h1>Thank You ❤️</h1>
  <p>Your RSVP has been received.</p>
  <p>We are so excited to celebrate this special day with you!</p>
  <a href="https://priyadathansj123-afk.github.io/wedding-invitation/">Back to Invitation</a>
</div>

<script>
const card = document.querySelector(".card");

setInterval(() => {
  const heart = document.createElement("span");
  heart.className = "heart";
  heart.textContent = "❤";
  heart.style.left = Math.random() * 100 + "%";
  heart.style.animationDuration = (3 + Math.random() * 3) + "s";
  card.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}, 600);
</script>

</body>
</html>
